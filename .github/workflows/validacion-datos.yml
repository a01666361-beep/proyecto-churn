name: Validación del contrato de datos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  contrato-y-regresion:
    name: contrato-y-regresion
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Revisar contrato y funcionamiento del dashboard
        run: python -m unittest discover -s tests -v
